<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 아침 영어 총복습 도우미</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #fff8f0; /* 복습 버전은 따뜻한 오렌지 톤 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
        }
        h2 { color: #ff6b00; margin-top: 0; }
        
        /* 로그인 화면 */
        .input-group {
            margin: 15px 0;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn {
            background-color: #ff6b00;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover { background-color: #e05e00; }

        /* 메인 메뉴 (10개 일차 선택) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 10개이므로 2열 5행으로 큼직하게 배치 */
            gap: 12px;
            margin-top: 20px;
        }
        .day-btn {
            background-color: #fff0e6;
            border: 2px solid #ffd1b3;
            border-radius: 12px;
            padding: 18px 10px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .day-btn:hover { background-color: #ffd1b3; }
        .day-btn.completed {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #28a745;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* 학습 화면 */
        .step-indicator { font-size: 1.1rem; color: #ff6b00; font-weight: bold; margin-bottom: 15px; }
        .word { font-size: 3.5rem; font-weight: bold; color: #1e90ff; margin-bottom: 10px; }
        .meaning { font-size: 2rem; color: #333; margin-bottom: 20px; }
        .sentence-box {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: left;
        }
        .sentence { font-size: 1.3rem; color: #444; margin-bottom: 5px; font-weight: bold; }
        .translation { font-size: 1.1rem; color: #666; }

        /* 발음 버튼 영역 */
        .audio-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .audio-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ff6b00;
            background-color: white;
            color: #ff6b00;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .audio-btn.played {
            background-color: #ff6b00;
            color: white;
        }
        .audio-btn:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }
        .hint { font-size: 0.95rem; color: #cc0000; font-weight: bold; margin-top: 15px; }

        /* 공책 쓰기용 스타일 (10개 항목에 맞춰 간격 최적화) */
        .write-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2c3e50;
            background-color: #ffe6e6;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            word-break: keep-all;
            line-height: 1.5;
            border-left: 5px solid #ff4d4d;
        }
        .write-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        .write-table td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
        }
        .write-table td.num-col {
            font-weight: bold;
            color: #777;
            text-align: center;
            width: 8%;
        }
        .write-table td.word-col {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e90ff;
            width: 47%;
        }
        .write-table td.mean-col {
            font-size: 1.15rem;
            color: #333;
            width: 45%;
        }
        .write-list-item {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
            line-height: 1.5;

            font-weight: bold;
            color: #ff6b00;
            font-size: 1.1rem;
            margin-right: 5px;

            font-size: 1.25rem;
            font-weight: bold;
            color: #2c3e50;
            display: block;
        }
        .write-list-kor {
            font-size: 1rem;
            color: #666;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<!-- 1단계: 로그인 화면 -->
<div class="card" id="login-view">
    <h2>🔥 아침 영어 10일 총복습 로그인</h2>
    <p style="color: #666; font-size: 0.95rem;">기존과 같은 이름과 비밀번호를 입력하세요.</p>
    <div class="input-group">
        <label for="username">이름</label>
        <input type="text" id="username" placeholder="이름을 입력하세요">
    </div>
    <div class="input-group">
        <label for="password">비밀번호 (4자리)</label>
        <input type="password" id="password" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="숫자 4자리">
    </div>
    <button class="btn" onclick="login()">복습 시작하기</button>
</div>

<!-- 2단계: 10개 복습 선택창 (메인 메뉴) -->
<div class="card" id="menu-view" style="display: none;">
    <h2 id="welcome-msg">환영합니다!</h2>
    <p style="color: #666; margin-bottom: 20px;">하루에 10개씩! 복습할 일차(Day)를 선택하세요.</p>
    <div class="grid-container" id="day-grid">
        <!-- 1~10일차 버튼이 동적으로 생성됩니다 -->
    </div>
    <button class="btn" style="background-color: #888; margin-top: 25px;" onclick="logout()">로그아웃</button>
</div>

<!-- 3단계: 단어/문장 학습 화면 -->
<div class="card" id="study-view" style="display: none;">
    <div class="step-indicator" id="step-title">1단계: 단어 복습 (1/10)</div>
    <div class="word" id="display-word">Word</div>
    <div class="meaning" id="display-meaning">뜻</div>
    
    <!-- 문장 영역 (2단계 학습 때만 보임) -->
    <div class="sentence-box" id="sentence-box" style="display: none;">
        <div class="sentence" id="display-sentence">English Sentence</div>
        <div class="translation" id="display-translation">한국어 뜻</div>
    </div>

    <!-- 발음 듣기 1, 2, 3번 버튼 -->
    <p class="hint">📢 발음 버튼을 듣고 따라서 읽어보세요. 총 3번 반복해요.</p>
    <div class="audio-group">
        <button class="audio-btn" id="audio1" onclick="playTTS(1)">1</button>
        <button class="audio-btn" id="audio2" onclick="playTTS(2)" disabled>2</button>
        <button class="audio-btn" id="audio3" onclick="playTTS(3)" disabled>3</button>
    </div>

    <button class="btn" id="next-btn" onclick="nextStep()" disabled>발음을 모두 듣고 넘어가기</button>
    <button class="btn" style="background-color: #ff6b6b; margin-top: 10px;" onclick="exitStudy()">학습 중단하고 메뉴로</button>
</div>

<!-- 4단계: 영어공책 쓰기 (단어 10개 전체 보기) -->
<div class="card" id="write-words-view" style="display: none;">
    <div class="write-title">✏️ 영어공책에 1번 단어부터 순서대로 읽고 써봐요. 총 3번 반복해서 써요.</div>
    <table class="write-table">
        <tbody id="write-words-tbody">
            <!-- 단어 10개 리스트가 렌더링됩니다 -->
        </tbody>
    </table>
    <button class="btn" onclick="finishWordsWriting()">완료하고 다음 단계로 👉</button>
</div>

<!-- 5단계: 영어공책 쓰기 (문장 10개 전체 보기) -->
<div class="card" id="write-sentences-view" style="display: none;">

        // Day 9 (81~90)
        { word: "Hope", meaning: "희망, 바라다", sentence: "I hope you like it.", translation: "네가 그걸 마음에 들어 하면 좋겠어." },
        { word: "Interesting", meaning: "흥미로운", sentence: "This book is very interesting.", translation: "이 책은 매우 흥미로워." },
        { word: "Joy", meaning: "기쁨", sentence: "Children bring joy.", translation: "아이들은 기쁨을 가져다준다." },
        { word: "Kid", meaning: "아이, 어린이", sentence: "She is a smart kid.", translation: "그녀는 똑똑한 아이야." },
        { word: "Language", meaning: "언어", sentence: "English is a global language.", translation: "영어는 세계적인 언어이다." },
        { word: "Illness", meaning: "병, 아픔", sentence: "He recovered from illness.", translation: "그는 병에서 회복되었다." },
        { word: "Judge", meaning: "판사, 판단하다", sentence: "Don't judge a book by its cover.", translation: "겉표지로 책을 판단하지 마라." },
        { word: "Kitchen", meaning: "부엌", sentence: "Mom is in the kitchen.", translation: "엄마는 부엌에 계셔." },
        { word: "Leader", meaning: "지도자, 리더", sentence: "He is a good class leader.", translation: "그는 좋은 학급 회장이다." },
        { word: "Magazine", meaning: "잡지", sentence: "I like reading sports magazines.", translation: "나는 스포츠 잡지 읽는 것을 좋아해." },
        
        // Day 10 (91~100)
        { word: "Juice", meaning: "주스", sentence: "I want orange juice.", translation: "오렌지 주스 원해요." },
        { word: "Key", meaning: "열쇠, 비결", sentence: "Where is my car key?", translation: "내 차 열쇠가 어디 있지?" },
        { word: "Library", meaning: "도서관", sentence: "Let's meet at the library.", translation: "도서관에서 만나자." },
        { word: "Major", meaning: "주요한, 전공", sentence: "Safety is our major concern.", translation: "안전이 우리의 주요 관심사이다." },
        { word: "Neighbor", meaning: "이웃", sentence: "Say hello to your neighbor.", translation: "이웃에게 인사해라." },
        { word: "Call", meaning: "부르다, 전화하다", sentence: "Call me later.", translation: "나중에 전화해." },
        { word: "Danger", meaning: "위험", sentence: "The sign warns of danger.", translation: "그 표지판은 위험을 경고한다." },
        { word: "Earth", meaning: "지구", sentence: "The Earth is round.", translation: "지구는 둥글다." },
        { word: "Habit", meaning: "습관", sentence: "Break bad habits.", translation: "나쁜 습관을 버려라." },
        { word: "Happy", meaning: "행복한", sentence: "We are so happy today.", translation: "우리는 오늘 정말 행복해." }
    ];

    const WORDS_PER_DAY = 10; // 하루 10개 설정
    const TOTAL_DAYS = 10;    // 총 10일 설정

    let currentUser = null;
    let userProgress = {}; 
    let currentDay = 1;
    let currentStage = 1; // 1: 단어, 2: 문장
    let currentIndex = 0; // 0 ~ 9 (10개 단어)
    let audioPlayed = [false, false, false];

    // 로그인 기능 (기존 20일 데이터와 구분하기 위해 _review 접미사 사용)
    function login() {
        const name = document.getElementById("username").value.trim();
        const pin = document.getElementById("password").value.trim();

        if (!name || pin.length !== 4 || isNaN(pin)) {
            alert("올바른 이름과 4자리 숫자 비밀번호를 입력해주세요.");
            return;
        }

        currentUser = `${name}_${pin}_review`;
        document.getElementById("welcome-msg").innerText = `🔥 ${name} 학생, 총복습 화이팅!`;
        
        const savedData = localStorage.getItem(currentUser);
        userProgress = savedData ? JSON.parse(savedData) : {};

        buildMenu();
        showView("menu-view");
    }

    // 로그아웃
    function logout() {
        currentUser = null;
        userProgress = {};
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        showView("login-view");
    }

    // 화면 전환 함수
    function showView(viewId) {
        document.getElementById("login-view").style.display = "none";
        document.getElementById("menu-view").style.display = "none";
        document.getElementById("study-view").style.display = "none";
        document.getElementById("write-words-view").style.display = "none";
        document.getElementById("write-sentences-view").style.display = "none";
        document.getElementById(viewId).style.display = "block";
    }

    // 10개 일차 복습 선택창 생성
    function buildMenu() {
        const grid = document.getElementById("day-grid");
        grid.innerHTML = "";

        for (let i = 1; i <= TOTAL_DAYS; i++) {
            const btn = document.createElement("button");
            btn.className = "day-btn";
            btn.innerText = `복습 Day ${i} (10개)`;
            
            if (userProgress[`Day${i}`]) {
                btn.classList.add("completed");
                const badge = document.createElement("span");
                badge.className = "badge";
                badge.innerText = "완료";
                btn.appendChild(badge);
            }

            btn.onclick = () => startStudy(i);
            grid.appendChild(btn);
        }
    }

    // 공부 시작
    function startStudy(day) {
        currentDay = day;
        currentStage = 1;
        currentIndex = 0;
        resetAudioStatus();
        
        showView("study-view");
        updateStudyUI();
    }

    // 오디오 상태 리셋
    function resetAudioStatus() {
        audioPlayed = [false, false, false];
        document.getElementById("audio1").className = "audio-btn";
        document.getElementById("audio2").className = "audio-btn";
        document.getElementById("audio3").className = "audio-btn";
        
        document.getElementById("audio1").disabled = false;
        document.getElementById("audio2").disabled = true;
        document.getElementById("audio3").disabled = true;
        
        document.getElementById("next-btn").disabled = true;
        document.getElementById("next-btn").innerText = "발음을 모두 듣고 넘어가기";
    }

    // TTS 발음 소리 송출
    function playTTS(btnNum) {
        const dayStartIndex = (currentDay - 1) * WORDS_PER_DAY;
        const currentData = allWords[dayStartIndex + currentIndex];
        
        const textToSpeak = (currentStage === 1) ? currentData.word : currentData.sentence;

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);

        audioPlayed[btnNum - 1] = true;
        const currentBtn = document.getElementById(`audio${btnNum}`);
        currentBtn.classList.add("played");

        if (btnNum === 1) {
            document.getElementById("audio2").disabled = false;
        } else if (btnNum === 2) {
            document.getElementById("audio3").disabled = false;
        } else if (btnNum === 3) {
            document.getElementById("next-btn").disabled = false;
            document.getElementById("next-btn").innerText = "다음 단계로 넘어가기 👉";
        }
    }

    // 학습 화면 업데이트
    function updateStudyUI() {
        const dayStartIndex = (currentDay - 1) * WORDS_PER_DAY;
        const currentData = allWords[dayStartIndex + currentIndex];

        if (currentStage === 1) {
            document.getElementById("step-title").innerText = `복습 Day ${currentDay} [1단계: 단어 복습] ${currentIndex + 1} / ${WORDS_PER_DAY}`;
            document.getElementById("display-word").innerText = currentData.word;
            document.getElementById("display-meaning").innerText = currentData.meaning;
            document.getElementById("sentence-box").style.display = "none";
        } else {
            document.getElementById("step-title").innerText = `복습 Day ${currentDay} [2단계: 문장 복습] ${currentIndex + 1} / ${WORDS_PER_DAY}`;
            document.getElementById("display-word").innerText = currentData.word;
            document.getElementById("display-meaning").innerText = currentData.meaning;
            document.getElementById("display-sentence").innerText = currentData.sentence;
            document.getElementById("display-translation").innerText = currentData.translation;
            document.getElementById("sentence-box").style.display = "block";
        }
        resetAudioStatus();
    }

    // 다음으로 넘어가기 버튼 클릭
    function nextStep() {
        currentIndex++;

        if (currentIndex >= WORDS_PER_DAY) {
            currentIndex = 0;
            if (currentStage === 1) {
                currentStage = 2;
                alert("🎉 1단계 단어 10개 복습 완료! 이제 문장 10개를 귀로 들으며 읽어봅시다.");
            } else {
                setupWordsWritingView();
                return;
            }
        }
        updateStudyUI();
    }

    // 3단계: 단어 10개 쓰기 화면 구성
    function setupWordsWritingView() {
        const dayStartIndex = (currentDay - 1) * WORDS_PER_DAY;
        const tbody = document.getElementById("write-words-tbody");
        tbody.innerHTML = "";

        for (let i = 0; i < WORDS_PER_DAY; i++) {
            const currentData = allWords[dayStartIndex + i];
            const row = document.createElement("tr");

            row.innerHTML = `
                <td class="num-col">${i + 1}</td>
                <td class="word-col">${currentData.word}</td>
                <td class="mean-col">${currentData.meaning}</td>
            `;
            tbody.appendChild(row);
        }

        showView("write-words-view");
    }

    // 단어 쓰기 완료 -> 문장 10개 쓰기 구성
    function finishWordsWriting() {
        const dayStartIndex = (currentDay - 1) * WORDS_PER_DAY;
        const listDiv = document.getElementById("write-sentences-list");
        listDiv.innerHTML = "";

        for (let i = 0; i < WORDS_PER_DAY; i++) {
            const currentData = allWords[dayStartIndex + i];
            const item = document.createElement("div");
            item.className = "write-list-item";

            item.innerHTML = `
                <span class="write-list-eng"><span class="write-list-num">${i + 1}.</span> ${currentData.sentence}</span>
                <span class="write-list-kor">${currentData.translation}</span>
            `;
            listDiv.appendChild(item);
        }

        showView("write-sentences-view");
    }

    // 모든 과정 마치고 저장 및 메뉴로 복귀
    function finishAllStudy() {
        userProgress[`Day${currentDay}`] = true;
        localStorage.setItem(currentUser, JSON.stringify(userProgress));
        
        alert(`👏 오늘 복습 10개를 완벽히 완료했습니다! 공책을 선생님께 보여드리고 확인을 받으세요!`);
        buildMenu();
        showView("menu-view");
    }

    // 중간 이탈
    function exitStudy() {
        if (confirm("정말 학습을 중단하고 메뉴로 돌아가겠습니까? 현재 일차의 기록은 저장되지 않습니다.")) {
            buildMenu();
            showView("menu-view");
        }
    }
</script>

</body>
</html>
